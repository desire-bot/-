<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f0f4f8"> 
    <title>МедКарта</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ПРИВЕТСТВЕННЫЙ ЭКРАН -->
    <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-content">
            <div class="welcome-icon">🏥</div>
            <h1 class="welcome-title">Симптомы</h1>
            <p class="welcome-subtitle">Ваш персональный дневник здоровья</p>
            
            <div class="welcome-card">
                <div class="welcome-greeting" id="welcome-greeting"></div>
                <p class="welcome-date" id="welcome-date"></p>
                
                <div class="welcome-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-records">0</div>
                        <div class="stat-label">записей</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-days">0</div>
                        <div class="stat-label">дней</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-streak">0</div>
                        <div class="stat-label">дней подряд</div>
                    </div>
                </div>
            </div>

            <div class="welcome-motivation" id="welcome-motivation"></div>

            <div class="welcome-actions">
                <button class="welcome-btn primary" id="btn-start-record">✚ Записать симптом</button>
                <button class="welcome-btn secondary" id="btn-go-history">📋 История</button>
            </div>

            <div class="welcome-footer">
                <button class="lang-switch" id="lang-switch">🌐 English</button>
                <button class="theme-switch" id="theme-switch">🌙 Тёмная тема</button>
                <span class="version">v2.2</span>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div class="app-screen" id="app-screen" style="display:none;">
        <div class="header">
            <button class="back-btn" id="back-btn">←</button>
            <h1>🩺 Симптомы</h1>
            <div class="header-actions">
                <button class="theme-switch-sm" id="theme-switch-sm" title="Тема">🌓</button>
                <div class="date-badge" id="today-date"></div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" data-panel="p-in">Ввод</div>
            <div class="tab" data-panel="p-hist">История</div>
            <div class="tab" data-panel="p-rep">Отчёт</div>
        </div>

        <!-- Ввод -->
        <div class="panel active" id="p-in">
            <div class="view-toggle">
                <button class="view-btn active" data-view="body">Тело</button>
                <button class="view-btn" data-view="organs">Органы</button>
            </div>

            <div class="silhouette-container" id="silhouette-body">
                <svg viewBox="0 0 200 460">
                    <defs>
                        <filter id="body-shadow">
                            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
                        </filter>
                    </defs>
                    
                    <g filter="url(#body-shadow)">
                        <!-- Голова -->
                        <ellipse cx="100" cy="34" rx="26" ry="29" class="zone" data-zone="Голова"/>
                        
                        <!-- Шея -->
                        <rect x="89" y="60" width="22" height="18" rx="5" class="zone" data-zone="Шея"/>
                        
                        <!-- Торс -->
                        <path d="M62 76 
                                 C62 76, 56 105, 56 135 
                                 L56 215 
                                 C56 226, 63 234, 78 238 
                                 L100 242 
                                 L122 238 
                                 C137 234, 144 226, 144 215 
                                 L144 135 
                                 C144 105, 138 76, 138 76 
                                 C131 72, 120 68, 100 68 
                                 C80 68, 69 72, 62 76 Z" 
                              class="zone" data-zone="Торс"/>
                        
                        <!-- Левая рука -->
                        <path d="M62 84 
                                 C53 86, 36 94, 23 109 
                                 C16 119, 13 133, 12 147 
                                 C11 161, 12 175, 14 188 
                                 C15 198, 18 206, 26 212 
                                 C32 216, 40 213, 44 206 
                                 C46 202, 46 196, 44 190" 
                              class="zone" data-zone="Левая рука"/>
                        <ellipse cx="36" cy="216" rx="16" ry="11" class="zone" data-zone="Левая кисть"/>
                        
                        <!-- Правая рука -->
                        <path d="M138 84 
                                 C147 86, 164 94, 177 109 
                                 C184 119, 187 133, 188 147 
                                 C189 161, 188 175, 186 188 
                                 C185 198, 182 206, 174 212 
                                 C168 216, 160 213, 156 206 
                                 C154 202, 154 196, 156 190" 
                              class="zone" data-zone="Правая рука"/>
                        <ellipse cx="164" cy="216" rx="16" ry="11" class="zone" data-zone="Правая кисть"/>
                        
                        <!-- Таз -->
                        <ellipse cx="100" cy="244" rx="48" ry="20" class="zone" data-zone="Таз"/>
                        
                        <!-- Левая нога -->
                        <path d="M74 254 
                                 C68 258, 58 270, 53 290 
                                 L50 340 
                                 C48 356, 46 370, 48 382 
                                 C50 390, 56 396, 66 394 
                                 C74 392, 80 386, 82 376" 
                              class="zone" data-zone="Левая нога"/>
                        <ellipse cx="66" cy="404" rx="24" ry="10" class="zone" data-zone="Левая стопа"/>
                        
                        <!-- Правая нога -->
                        <path d="M126 254 
                                 C132 258, 142 270, 147 290 
                                 L150 340 
                                 C152 356, 154 370, 152 382 
                                 C150 390, 144 396, 134 394 
                                 C126 392, 120 386, 118 376" 
                              class="zone" data-zone="Правая нога"/>
                        <ellipse cx="134" cy="404" rx="24" ry="10" class="zone" data-zone="Правая стопа"/>
                    </g>
                </svg>
            </div>

            <div class="silhouette-container" id="silhouette-organs" style="display:none;">
                <svg viewBox="0 0 200 460">
                    <defs>
                        <filter id="organ-shadow">
                            <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15"/>
                        </filter>
                    </defs>
                    
                    <g filter="url(#organ-shadow)">
                        <!-- Фоновый контур тела -->
                        <ellipse cx="100" cy="34" rx="26" ry="29" fill="#f0f4f8" stroke="#c8cdd5" stroke-width="1" opacity="0.25"/>
                        <path d="M62 76 C62 76, 56 105, 56 135 L56 215 C56 226, 63 234, 78 238 L100 242 L122 238 C137 234, 144 226, 144 215 L144 135 C144 105, 138 76, 138 76 C131 72, 120 68, 100 68 C80 68, 69 72, 62 76 Z" fill="#f0f4f8" stroke="#c8cdd5" stroke-width="1" opacity="0.25"/>
                        
                        <!-- МОЗГ (увеличен) -->
                        <ellipse cx="100" cy="28" rx="18" ry="16" class="zone organ-zone" data-zone="Голова" data-organ="Мозг"/>
                        <ellipse cx="100" cy="30" rx="12" ry="10" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.5"/>
                        <text x="100" y="32" text-anchor="middle" font-size="7" fill="#475569" font-weight="600" pointer-events="none">Мозг</text>
                        
                        <!-- ГЛАЗА (увеличены) -->
                        <ellipse cx="88" cy="22" rx="6" ry="5" class="zone organ-zone" data-zone="Голова" data-organ="Глаза"/>
                        <circle cx="88" cy="22" r="2.5" fill="#64748b" opacity="0.4" pointer-events="none"/>
                        <ellipse cx="112" cy="22" rx="6" ry="5" class="zone organ-zone" data-zone="Голова" data-organ="Глаза"/>
                        <circle cx="112" cy="22" r="2.5" fill="#64748b" opacity="0.4" pointer-events="none"/>
                        
                        <!-- УШИ (увеличены) -->
                        <ellipse cx="70" cy="30" rx="5" ry="8" class="zone organ-zone" data-zone="Голова" data-organ="Уши"/>
                        <ellipse cx="130" cy="30" rx="5" ry="8" class="zone organ-zone" data-zone="Голова" data-organ="Уши"/>
                        
                        <!-- ПАЗУХИ/НОС -->
                        <ellipse cx="100" cy="40" rx="6" ry="4" class="zone organ-zone" data-zone="Голова" data-organ="Нос"/>
                        
                        <!-- РОТ/ЗУБЫ/ЧЕЛЮСТЬ -->
                        <path d="M92 48 Q100 54 108 48" fill="none" stroke="#c8cdd5" stroke-width="4" stroke-linecap="round" class="zone organ-zone" data-zone="Голова" data-organ="Зубы"/>
                        
                        <!-- ГОРЛО (увеличено) -->
                        <rect x="90" y="58" width="20" height="20" rx="6" class="zone organ-zone" data-zone="Шея" data-organ="Горло"/>
                        <text x="100" y="71" text-anchor="middle" font-size="7" fill="#475569" font-weight="600" pointer-events="none">Горло</text>
                        
                        <!-- ЩИТОВИДНАЯ ЖЕЛЕЗА -->
                        <path d="M86 78 C86 74, 94 72, 100 74 C106 72, 114 74, 114 78 C114 82, 106 84, 100 84 C94 84, 86 82, 86 78 Z" class="zone organ-zone" data-zone="Шея" data-organ="Щитовидная железа"/>
                        <text x="100" y="80" text-anchor="middle" font-size="5" fill="#475569" pointer-events="none">Щитовидная</text>
                        
                        <!-- ЛИМФОУЗЛЫ ШЕИ -->
                        <circle cx="82" cy="74" r="4" class="zone organ-zone" data-zone="Шея" data-organ="Лимфоузлы"/>
                        <circle cx="118" cy="74" r="4" class="zone organ-zone" data-zone="Шея" data-organ="Лимфоузлы"/>
                        
                        <!-- СЕРДЦЕ (увеличено, более реалистично) -->
                        <path d="M88 100 
                                 C82 94, 72 100, 74 110 
                                 C75 118, 88 130, 88 130 
                                 C88 130, 101 118, 102 110 
                                 C104 100, 94 94, 88 100 Z" 
                              class="zone organ-zone" data-zone="Торс" data-organ="Сердце"/>
                        <text x="88" y="116" text-anchor="middle" font-size="7" fill="#475569" font-weight="600" pointer-events="none">Сердце</text>
                        
                        <!-- ЛЁГКИЕ (увеличены, форма реалистичнее) -->
                        <path d="M72 104 C64 100, 58 110, 60 124 C62 138, 72 146, 78 148 L80 150 L72 152 C66 148, 60 140, 58 130 C56 116, 58 102, 72 104 Z" class="zone organ-zone" data-zone="Торс" data-organ="Лёгкие"/>
                        <text x="68" y="126" text-anchor="middle" font-size="6" fill="#475569" font-weight="600" pointer-events="none">Лёгкое</text>
                        
                        <path d="M128 104 C136 100, 142 110, 140 124 C138 138, 128 146, 122 148 L120 150 L128 152 C134 148, 140 140, 142 130 C144 116, 142 102, 128 104 Z" class="zone organ-zone" data-zone="Торс" data-organ="Лёгкие"/>
                        <text x="132" y="126" text-anchor="middle" font-size="6" fill="#475569" font-weight="600" pointer-events="none">Лёгкое</text>
                        
                        <!-- ПЕЧЕНЬ (увеличена) -->
                        <path d="M74 148 C68 144, 66 152, 70 162 C74 170, 90 174, 100 174 C108 174, 116 170, 118 164 C120 158, 116 150, 110 148 C104 146, 96 146, 88 148 C82 148, 78 150, 74 148 Z" class="zone organ-zone" data-zone="Торс" data-organ="Печень"/>
                        <text x="96" y="164" text-anchor="middle" font-size="7" fill="#475569" font-weight="600" pointer-events="none">Печень</text>
                        
                        <!-- ЖЕЛУДОК (увеличен) -->
                        <path d="M76 162 C72 158, 70 166, 72 176 C74 186, 82 194, 92 196 C100 198, 108 194, 110 186 C112 178, 108 168, 104 162 C100 158, 94 156, 88 158 C82 160, 78 164, 76 162 Z" class="zone organ-zone" data-zone="Торс" data-organ="Желудок"/>
                        <text x="92" y="180" text-anchor="middle" font-size="7" fill="#475569" font-weight="600" pointer-events="none">Желудок</text>
                        
                        <!-- ПОДЖЕЛУДОЧНАЯ -->
                        <path d="M80 190 C78 186, 90 182, 100 184 C110 186, 120 188, 122 192 C120 196, 110 198, 100 196 C90 194, 82 194, 80 190 Z" class="zone organ-zone" data-zone="Торс" data-organ="Поджелудочная"/>
                        <text x="100" y="191" text-anchor="middle" font-size="5" fill="#475569" pointer-events="none">Поджел.</text>
                        
                        <!-- СЕЛЕЗЁНКА -->
                        <ellipse cx="64" cy="154" rx="7" ry="10" class="zone organ-zone" data-zone="Торс" data-organ="Селезёнка"/>
                        <text x="64" y="157" text-anchor="middle" font-size="5" fill="#475569" pointer-events="none">Селез.</text>
                        
                        <!-- ПОЧКИ (увеличены) -->
                        <ellipse cx="68" cy="170" rx="9" ry="12" class="zone organ-zone" data-zone="Торс" data-organ="Почки"/>
                        <ellipse cx="68" cy="170" rx="5" ry="7" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.5" pointer-events="none"/>
                        <text x="68" y="174" text-anchor="middle" font-size="6" fill="#475569" font-weight="600" pointer-events="none">Почка</text>
                        
                        <ellipse cx="132" cy="170" rx="9" ry="12" class="zone organ-zone" data-zone="Торс" data-organ="Почки"/>
                        <ellipse cx="132" cy="170" rx="5" ry="7" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.5" pointer-events="none"/>
                        <text x="132" y="174" text-anchor="middle" font-size="6" fill="#475569" font-weight="600" pointer-events="none">Почка</text>
                        
                        <!-- КИШЕЧНИК (увеличен, волнистый) -->
                        <path d="M72 196 C68 204, 76 210, 80 206 C84 202, 82 210, 86 214 C90 218, 94 210, 98 214 C102 218, 106 210, 110 214 C114 218, 118 210, 122 214 C126 218, 128 210, 124 204 C120 198, 112 196, 106 200 C100 204, 94 200, 90 196 C86 192, 80 194, 78 198 C76 200, 74 198, 72 196 Z" fill="none" stroke="#c8cdd5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="zone organ-zone" data-zone="Торс" data-organ="Кишечник"/>
                        
                        <!-- МОЧЕВОЙ ПУЗЫРЬ (увеличен) -->
                        <ellipse cx="100" cy="235" rx="16" ry="11" class="zone organ-zone" data-zone="Таз" data-organ="Мочевой пузырь"/>
                        <text x="100" y="238" text-anchor="middle" font-size="6" fill="#475569" font-weight="600" pointer-events="none">Моч.пуз.</text>
                        
                        <!-- РЕПРОДУКТИВНЫЕ ОРГАНЫ -->
                        <ellipse cx="100" cy="252" rx="14" ry="7" class="zone organ-zone" data-zone="Таз" data-organ="Репродуктивные органы"/>
                        <text x="100" y="254" text-anchor="middle" font-size="5" fill="#475569" pointer-events="none">Репрод.</text>
                        
                        <!-- АППЕНДИКС -->
                        <circle cx="62" cy="210" r="5" class="zone organ-zone" data-zone="Торс" data-organ="Аппендикс"/>
                        <text x="62" y="213" text-anchor="middle" font-size="4" fill="#475569" pointer-events="none">Апп.</text>
                        
                        <!-- ЖЕЛЧНЫЙ ПУЗЫРЬ -->
                        <ellipse cx="76" cy="155" rx="5" ry="7" class="zone organ-zone" data-zone="Торс" data-organ="Желчный пузырь"/>
                        <text x="76" y="157" text-anchor="middle" font-size="4" fill="#475569" pointer-events="none">Желч.</text>
                        
                        <!-- ПИЩЕВОД (линия) -->
                        <line x1="100" y1="110" x2="96" y2="160" stroke="#c8cdd5" stroke-width="6" stroke-linecap="round" class="zone organ-zone" data-zone="Торс" data-organ="Пищевод"/>
                        
                        <!-- ТРАХЕЯ -->
                        <line x1="100" y1="78" x2="100" y2="108" stroke="#c8cdd5" stroke-width="8" stroke-linecap="round" class="zone organ-zone" data-zone="Шея" data-organ="Трахея"/>
                        
                        <!-- ГРУДНАЯ КЛЕТКА (рёбра) -->
                        <path d="M64 120 L136 120 M60 130 L140 130 M58 140 L142 140" stroke="#c8cdd5" stroke-width="2" opacity="0.4" fill="none"/>
                        
                        <!-- ПОЗВОНОЧНИК -->
                        <line x1="100" y1="64" x2="100" y2="242" stroke="#c8cdd5" stroke-width="5" stroke-linecap="round" class="zone organ-zone" data-zone="Торс" data-organ="Позвоночник (грудной)"/>
                        
                        <!-- ТАЗОБЕДРЕННЫЙ СУСТАВ -->
                        <circle cx="82" cy="244" r="8" class="zone organ-zone" data-zone="Таз" data-organ="Тазобедренный сустав"/>
                        <circle cx="118" cy="244" r="8" class="zone organ-zone" data-zone="Таз" data-organ="Тазобедренный сустав"/>
                        
                        <!-- КОЛЕНИ -->
                        <circle cx="62" cy="310" r="8" class="zone organ-zone" data-zone="Левая нога" data-organ="Колено"/>
                        <text x="62" y="313" text-anchor="middle" font-size="5" fill="#475569" pointer-events="none">Колено</text>
                        <circle cx="138" cy="310" r="8" class="zone organ-zone" data-zone="Правая нога" data-organ="Колено"/>
                        <text x="138" y="313" text-anchor="middle" font-size="5" fill="#475569" pointer-events="none">Колено</text>
                    </g>
                </svg>
            </div>

            <div class="section-title" id="selected-info" style="text-align:center;min-height:18px;"></div>

            <div class="section-title">Тип</div>
            <div class="btn-row" id="type-buttons">
                <div class="btn" data-type="Боль">Боль</div>
                <div class="btn" data-type="Тошнота">Тошнота</div>
                <div class="btn" data-type="Головокружение">Круж.гол</div>
                <div class="btn" data-type="Онемение">Онемение</div>
                <div class="btn" data-type="Жжение">Жжение</div>
                <div class="btn" data-type="Давление">Давление</div>
                <div class="btn" data-type="Спазм">Спазм</div>
                <div class="btn" data-type="Другое">Другое</div>
            </div>

            <div id="pain-char-row" style="display:none;">
                <div class="section-title">Характер</div>
                <div class="btn-row" id="pain-char-buttons">
                    <div class="btn" data-pain-char="Острая">Острая</div>
                    <div class="btn" data-pain-char="Тянущая">Тянущая</div>
                    <div class="btn" data-pain-char="Пульсирующая">Пульсир</div>
                    <div class="btn" data-pain-char="Тупая">Тупая</div>
                </div>
            </div>

            <div class="section-title">Интенсивность</div>
            <div class="intensity-row" id="intensity-buttons"></div>

            <textarea class="note-input" placeholder="Заметка" id="note"></textarea>
            <button class="save-btn" id="save-btn">Зафиксировать</button>
            <div class="saved-msg" id="saved-msg">✅ Записано</div>
        </div>

        <!-- История -->
        <div class="panel" id="p-hist">
            <div id="history-list"></div>
        </div>

        <!-- Отчёт -->
        <div class="panel" id="p-rep">
            <div class="card">
                <div class="section-title" style="margin-top:0">Период</div>
                <div class="report-row">
                    <input type="date" id="r-from">
                    <span>—</span>
                    <input type="date" id="r-to">
                    <button class="report-btn" id="gen-rep">Показать</button>
                </div>
                
                <div class="report-output" id="rep-out">Выбери период и нажми «Показать».</div>
                <div class="report-actions">
                    <button class="copy-btn" id="copy-rep">📋 Скопировать</button>
                    <button class="copy-btn" id="pdf-rep">🖨️ Сохранить PDF</button>
                </div>
            </div>
        </div>

        <!-- Модалка -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal">
                <h3>📝 Детали</h3>
                <div id="modal-content"></div>
                <div class="btn-row">
                    <button class="btn-close-modal" id="btn-close">Закрыть</button>
                    <button class="btn-save-context" id="btn-save">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
