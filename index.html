<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f0f4f8">
    <title>Симптомы</title>

    <link rel="manifest" href="data:application/manifest+json,
    {
        %22name%22: %22Симптомы%22,
        %22short_name%22: %22Симптомы%22,
        %22start_url%22: %22.%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22#f0f4f8%22,
        %22theme_color%22: %22#f0f4f8%22,
        %22icons%22: [{
            %22src%22: %22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white'>+</text></svg>%22,
            %22sizes%22: %22any%22,
            %22type%22: %22image/svg+xml%22
        }]
    }">

    <style>
        :root {
            --bg: #f0f4f8;
            --card: #fff;
            --primary: #2563eb;
            --danger: #e65050;
            --warning: #e5980b;
            --success: #10b981;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 12px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0 auto;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            padding: 8px 12px;
            padding-top: calc(8px + var(--safe-top));
            padding-bottom: calc(16px + var(--safe-bottom));
            min-height: 100vh;
            user-select: none;
        }

        /* Шапка — компактно */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
            white-space: nowrap;
        }
        .header .date-badge {
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--card);
            padding: 4px 8px;
            border-radius: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Табы — строго в строку */
        .tabs {
            display: flex;
            gap: 3px;
            margin-bottom: 8px;
            background: var(--card);
            border-radius: 10px;
            padding: 3px;
            position: sticky;
            top: calc(4px + var(--safe-top));
            z-index: 10;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tab.active {
            background: var(--primary);
            color: #fff;
        }

        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }

        /* Силуэт */
        .silhouette-container {
            display: flex;
            justify-content: center;
            margin: 0 0 4px;
        }
        svg {
            width: 130px;
            height: auto;
        }
        .zone {
            fill: #e8ecf1;
            stroke: #c8cdd5;
            stroke-width: 1.6;
            cursor: pointer;
        }
        .zone.active {
            fill: var(--danger);
            stroke: #c53030;
        }

        .section-title {
            font-size: 10px;
            color: var(--text-muted);
            margin: 6px 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .btn {
            padding: 6px 9px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 16px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .intensity-row {
            display: flex;
            gap: 2px;
        }
        .int-btn {
            flex: 1;
            padding: 8px 0;
            text-align: center;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .int-btn.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .int-btn.high-light {
            border-color: #fecaca;
            background: #fff5f5;
            color: var(--danger);
        }
        .int-btn.high-light.selected {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
        }

        .note-input {
            width: 100%;
            padding: 8px 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 12px;
            margin-top: 4px;
            resize: none;
            height: 34px;
            font-family: inherit;
        }

        .save-btn {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            background: var(--primary);
            border: none;
            color: #fff;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .save-btn:active {
            opacity: 0.9;
        }

        .saved-msg {
            text-align: center;
            color: var(--success);
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .saved-msg.show {
            opacity: 1;
        }

        /* История */
        .history-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item .left {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex: 1;
            min-width: 0;
        }
        .history-item .zone-name {
            font-weight: 600;
            font-size: 13px;
        }
        .history-item .type-name {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .history-item .date-name {
            font-size: 10px;
            color: var(--text-muted);
        }
        .history-item .right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .intensity-badge {
            border-radius: 5px;
            padding: 3px 6px;
            font-weight: 700;
            font-size: 11px;
        }
        .intensity-badge.high {
            background: #fef2f2;
            color: var(--danger);
        }
        .intensity-badge.mid {
            background: #fffbeb;
            color: var(--warning);
        }
        .intensity-badge.low {
            background: #eff4ff;
            color: var(--primary);
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            cursor: pointer;
            padding: 2px 6px;
        }
        .empty-history {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 24px;
        }

        /* Отчёт */
        .card {
            background: var(--card);
            border-radius: 10px;
            padding: 12px;
        }
        .report-row {
            display: flex;
            gap: 4px;
            align-items: center;
            margin-bottom: 8px;
        }
        .report-row input {
            flex: 1;
            padding: 7px 4px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 10px;
            font-family: inherit;
            min-width: 0;
        }
        .report-row span {
            font-size: 11px;
            flex-shrink: 0;
        }
        .report-btn {
            padding: 7px 10px;
            background: var(--primary);
            border: none;
            color: #fff;
            border-radius: 14px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .report-output {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
            max-height: 40vh;
            overflow-y: auto;
            font-family: 'SF Mono', monospace;
        }
        .copy-btn {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Модалка — шторка снизу */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.45);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 100;
            justify-content: center;
            align-items: flex-end;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--card);
            border-radius: 18px 18px 0 0;
            padding: 16px 14px;
            padding-bottom: calc(20px + var(--safe-bottom));
            width: 100%;
            max-height: 75vh;
            overflow-y: auto;
        }
        .modal h3 {
            font-size: 15px;
            margin-bottom: 10px;
        }
        .modal .field {
            margin-bottom: 8px;
        }
        .modal label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }
        .modal input {
            width: 100%;
            padding: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            margin-top: 2px;
        }
        .modal .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }
        .modal .btn-save-context,
        .modal .btn-close-modal {
            flex: 1;
            padding: 10px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .modal .btn-save-context {
            background: var(--primary);
            border: none;
            color: #fff;
        }
        .modal .btn-close-modal {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🩺 Симптомы</h1>
        <div class="date-badge" id="today-date"></div>
    </div>

    <div class="tabs">
        <div class="tab active" data-panel="p-in">Ввод</div>
        <div class="tab" data-panel="p-hist">История</div>
        <div class="tab" data-panel="p-rep">Отчёт</div>
    </div>

    <!-- Ввод -->
    <div class="panel active" id="p-in">
        <div class="silhouette-container">
            <svg viewBox="0 0 200 400">
                <circle cx="100" cy="35" r="26" class="zone" data-zone="Голова"/>
                <rect x="89" y="58" width="22" height="18" rx="4" class="zone" data-zone="Шея"/>
                <rect x="67" y="74" width="66" height="75" rx="10" class="zone" data-zone="Грудь"/>
                <rect x="70" y="148" width="60" height="38" rx="7" class="zone" data-zone="Живот верх"/>
                <rect x="70" y="184" width="60" height="28" rx="7" class="zone" data-zone="Живот низ"/>
                <rect x="17" y="82" width="20" height="50" rx="7" class="zone" data-zone="Левое плечо"/>
                <rect x="19" y="130" width="18" height="46" rx="6" class="zone" data-zone="Левое предплечье"/>
                <rect x="163" y="82" width="20" height="50" rx="7" class="zone" data-zone="Правое плечо"/>
                <rect x="163" y="130" width="18" height="46" rx="6" class="zone" data-zone="Правое предплечье"/>
                <rect x="72" y="210" width="56" height="22" rx="4" class="zone" data-zone="Поясница"/>
                <rect x="56" y="230" width="28" height="55" rx="7" class="zone" data-zone="Левое бедро"/>
                <rect x="116" y="230" width="28" height="55" rx="7" class="zone" data-zone="Правое бедро"/>
                <rect x="58" y="283" width="24" height="50" rx="6" class="zone" data-zone="Левая голень"/>
                <rect x="118" y="283" width="24" height="50" rx="6" class="zone" data-zone="Правая голень"/>
            </svg>
        </div>

        <div class="section-title">Тип</div>
        <div class="btn-row" id="type-buttons">
            <div class="btn" data-type="Боль">Боль</div>
            <div class="btn" data-type="Тошнота">Тошнота</div>
            <div class="btn" data-type="Головокружение">Круж.гол</div>
            <div class="btn" data-type="Онемение">Онемение</div>
            <div class="btn" data-type="Жжение">Жжение</div>
            <div class="btn" data-type="Давление">Давление</div>
            <div class="btn" data-type="Спазм">Спазм</div>
            <div class="btn" data-type="Другое">Другое</div>
        </div>

        <div id="pain-char-row" style="display:none;">
            <div class="section-title">Характер</div>
            <div class="btn-row" id="pain-char-buttons">
                <div class="btn" data-pain-char="Острая">Острая</div>
                <div class="btn" data-pain-char="Тянущая">Тянущая</div>
                <div class="btn" data-pain-char="Пульсирующая">Пульсир</div>
                <div class="btn" data-pain-char="Тупая">Тупая</div>
            </div>
        </div>

        <div class="section-title">Интенсивность</div>
        <div class="intensity-row" id="intensity-buttons"></div>

        <textarea class="note-input" placeholder="Заметка" id="note"></textarea>
        <button class="save-btn" id="save-btn">Зафиксировать</button>
        <div class="saved-msg" id="saved-msg">✅ Записано</div>
    </div>

    <!-- История -->
    <div class="panel" id="p-hist">
        <div id="history-list"></div>
    </div>

    <!-- Отчёт -->
    <div class="panel" id="p-rep">
        <div class="card">
            <div class="section-title" style="margin-top:0">Период</div>
            <div class="report-row">
                <input type="date" id="r-from">
                <span>—</span>
                <input type="date" id="r-to">
                <button class="report-btn" id="gen-rep">Показать</button>
            </div>
            <div class="report-output" id="rep-out">Выбери период и нажми «Показать».</div>
            <button class="copy-btn" id="copy-rep">📋 Скопировать</button>
        </div>
    </div>

    <!-- Модалка -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h3>📝 Детали</h3>
            <div id="modal-content"></div>
            <div class="btn-row">
                <button class="btn-close-modal" id="btn-close">Закрыть</button>
                <button class="btn-save-context" id="btn-save">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        let selZ = null, selT = null, selP = null, selI = null, editId = null;
        document.getElementById('today-date').textContent = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

        const iRow = document.getElementById('intensity-buttons');
        for (let i = 1; i <= 10; i++) {
            const b = document.createElement('div');
            b.className = 'int-btn' + (i >= 7 ? ' high-light' : '');
            b.dataset.intensity = i;
            b.textContent = i;
            iRow.appendChild(b);
        }

        // Табы
        document.querySelectorAll('.tab').forEach(t => {
            t.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                t.classList.add('active');
                document.getElementById(t.dataset.panel).classList.add('active');
                if (t.dataset.panel === 'p-hist') renHist();
                if (t.dataset.panel === 'p-rep') initRep();
            });
        });

        // Зоны
        document.querySelectorAll('.zone').forEach(z => {
            z.addEventListener('click', () => {
                document.querySelectorAll('.zone').forEach(x => x.classList.remove('active'));
                z.classList.add('active');
                selZ = z.dataset.zone;
            });
        });

        function setup(id, attr, key) {
            const c = document.getElementById(id);
            if (!c) return;
            c.querySelectorAll('[data-' + attr + ']').forEach(b => {
                b.addEventListener('click', () => {
                    c.querySelectorAll('.btn, .int-btn').forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                    if (key === 'selT') {
                        selT = b.dataset[attr];
                        document.getElementById('pain-char-row').style.display = selT === 'Боль' ? 'block' : 'none';
                        if (selT !== 'Боль') { selP = null; }
                    } else if (key === 'selP') selP = b.dataset[attr];
                    else if (key === 'selI') selI = parseInt(b.dataset[attr]);
                });
            });
        }
        setup('type-buttons', 'type', 'selT');
        setup('pain-char-buttons', 'pain-char', 'selP');
        setup('intensity-buttons', 'intensity', 'selI');

        // Сохранение
        document.getElementById('save-btn').addEventListener('click', () => {
            if (!selZ || !selT || !selI) return alert('Заполни всё');
            const rec = { id: Date.now(), dateTime: new Date().toISOString(), zone: selZ, type: selT, painChar: selT === 'Боль' ? selP : null, intensity: selI, note: document.getElementById('note').value, context: {} };
            const h = JSON.parse(localStorage.getItem('sh') || '[]');
            h.unshift(rec);
            localStorage.setItem('sh', JSON.stringify(h));
            document.getElementById('saved-msg').classList.add('show');
            setTimeout(() => document.getElementById('saved-msg').classList.remove('show'), 1500);
            selZ = selT = selP = selI = null;
            document.querySelectorAll('.zone,.btn,.int-btn').forEach(x => x.classList.remove('active','selected'));
            document.getElementById('pain-char-row').style.display = 'none';
            document.getElementById('note').value = '';
        });

        function renHist() {
            const h = JSON.parse(localStorage.getItem('sh') || '[]');
            const list = document.getElementById('history-list');
            if (!h.length) { list.innerHTML = '<div class="empty-history">Нет записей</div>'; return; }
            list.innerHTML = h.map(r => {
                const d = new Date(r.dateTime);
                const ds = d.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                const ic = r.intensity >= 7 ? 'high' : (r.intensity >= 4 ? 'mid' : 'low');
                return `<div class="history-item" data-id="${r.id}"><div class="left"><span class="zone-name">${r.zone}</span><span class="type-name">${r.type}${r.painChar ? ', ' + r.painChar.toLowerCase() : ''}</span><span class="date-name">${ds}</span></div><div class="right"><span class="intensity-badge ${ic}">${r.intensity}/10</span><button class="delete-btn" data-del="${r.id}">✕</button></div></div>`;
            }).join('');
            list.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', e => { if (!e.target.classList.contains('delete-btn')) openMod(parseInt(item.dataset.id)); });
            });
            list.querySelectorAll('.delete-btn').forEach(b => {
                b.addEventListener('click', e => { e.stopPropagation(); delRec(parseInt(b.dataset.del)); });
            });
        }

        function delRec(id) {
            if (!confirm('Удалить?')) return;
            let h = JSON.parse(localStorage.getItem('sh') || '[]');
            h = h.filter(r => r.id !== id);
            localStorage.setItem('sh', JSON.stringify(h));
            renHist();
        }

        function openMod(id) {
            const h = JSON.parse(localStorage.getItem('sh') || '[]');
            const r = h.find(x => x.id === id);
            if (!r) return;
            editId = id;
            const d = new Date(r.dateTime);
            const ctx = r.context || {};
            document.getElementById('modal-content').innerHTML = `
                <p style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;">${d.toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})} — <b>${r.zone}</b>, ${r.type}${r.painChar?' ('+r.painChar.toLowerCase()+')':''}, <b>${r.intensity}/10</b></p>
                <div class="field"><label>Еда</label><input id="cf" value="${ctx.food||''}" placeholder="кофе"></div>
                <div class="field"><label>Сон (ч)</label><input id="cs" value="${ctx.sleep||''}" placeholder="6"></div>
                <div class="field"><label>Действие</label><input id="ca" value="${ctx.activity||''}" placeholder="сидел"></div>
                <div class="field"><label>Погода</label><input id="cw" value="${ctx.weather||''}" placeholder="дождь"></div>
            `;
            document.getElementById('modal-overlay').classList.add('open');
        }

        function closeMod() { document.getElementById('modal-overlay').classList.remove('open'); editId = null; }
        document.getElementById('btn-close').addEventListener('click', closeMod);
        document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === document.getElementById('modal-overlay')) closeMod(); });
        document.getElementById('btn-save').addEventListener('click', () => {
            if (!editId) return;
            const h = JSON.parse(localStorage.getItem('sh') || '[]');
            const r = h.find(x => x.id === editId);
            if (!r) return;
            r.context = { food: document.getElementById('cf').value, sleep: document.getElementById('cs').value, activity: document.getElementById('ca').value, weather: document.getElementById('cw').value };
            localStorage.setItem('sh', JSON.stringify(h));
            closeMod();
            renHist();
        });

        function initRep() {
            const n = new Date();
            const w = new Date(n.getTime() - 7*24*60*60*1000);
            document.getElementById('r-from').value = w.toISOString().split('T')[0];
            document.getElementById('r-to').value = n.toISOString().split('T')[0];
        }

        document.getElementById('gen-rep').addEventListener('click', () => {
            const f = new Date(document.getElementById('r-from').value);
            const t = new Date(document.getElementById('r-to').value + 'T23:59:59');
            if (isNaN(f) || isNaN(t)) return;
            const h = JSON.parse(localStorage.getItem('sh') || '[]');
            const fl = h.filter(r => { const d = new Date(r.dateTime); return d >= f && d <= t; });
            if (!fl.length) { document.getElementById('rep-out').textContent = 'Нет записей.'; return; }
            let rep = `ОТЧЁТ ДЛЯ ВРАЧА\n${'═'.repeat(26)}\n${f.toLocaleDateString('ru-RU')} — ${t.toLocaleDateString('ru-RU')}\nЭпизодов: ${fl.length}\n`;
            let si = 0;
            fl.forEach(r => si += r.intensity);
            rep += `Ср. интенсивность: ${(si/fl.length).toFixed(1)}/10\n${'─'.repeat(26)}\n`;
            fl.sort((a,b) => new Date(a.dateTime)-new Date(b.dateTime)).forEach((r,i) => {
                const d = new Date(r.dateTime);
                rep += `\n${i+1}. ${d.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}\n   ${r.zone}, ${r.type}${r.painChar?' ('+r.painChar.toLowerCase()+')':''}, ${r.intensity}/10\n`;
                if (r.context) {
                    if (r.context.food) rep += `   Еда: ${r.context.food}\n`;
                    if (r.context.sleep) rep += `   Сон: ${r.context.sleep}ч\n`;
                    if (r.context.activity) rep += `   Действие: ${r.context.activity}\n`;
                }
                if (r.note) rep += `   Заметка: ${r.note}\n`;
            });
            document.getElementById('rep-out').textContent = rep;
        });

        document.getElementById('copy-rep').addEventListener('click', () => {
            const t = document.getElementById('rep-out').textContent;
            if (t.startsWith('Выбери')) return;
            navigator.clipboard.writeText(t).then(() => {
                const b = document.getElementById('copy-rep');
                b.textContent = '✅ Скопировано!';
                setTimeout(() => b.textContent = '📋 Скопировать', 1500);
            });
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const sw = new Blob(["self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});"], {type:'application/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(sw)).catch(()=>{});
            });
        }
        renHist();
    </script>
</body>
</html>
