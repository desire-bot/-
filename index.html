<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f0f4f8">
    <title>МедКарта</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-content">
            <div class="welcome-icon">🏥</div>
            <h1 class="welcome-title">Симптомы</h1>
            <p class="welcome-subtitle">Ваш персональный дневник здоровья</p>
            <div class="welcome-card">
                <div class="welcome-greeting" id="welcome-greeting"></div>
                <p class="welcome-date" id="welcome-date"></p>
                <div class="welcome-stats">
                    <div class="stat-item"><div class="stat-value" id="stat-records">0</div><div class="stat-label">записей</div></div>
                    <div class="stat-item"><div class="stat-value" id="stat-days">0</div><div class="stat-label">дней</div></div>
                    <div class="stat-item"><div class="stat-value" id="stat-streak">0</div><div class="stat-label">дней подряд</div></div>
                </div>
            </div>
            <div class="welcome-motivation" id="welcome-motivation"></div>
            <div class="welcome-actions">
                <button class="welcome-btn primary" id="btn-start-record">✚ Записать симптом</button>
                <button class="welcome-btn secondary" id="btn-go-history">📋 История</button>
            </div>
            <div class="welcome-footer">
                <button class="lang-switch" id="lang-switch">🌐 English</button>
                <button class="theme-switch" id="theme-switch">🌙 Тёмная тема</button>
                <span class="version">v3.0</span>
            </div>
        </div>
    </div>

    <div class="app-screen" id="app-screen" style="display:none;">
        <div class="header">
            <button class="back-btn" id="back-btn">←</button>
            <h1>🩺 Симптомы</h1>
            <div class="header-actions">
                <button class="theme-switch-sm" id="theme-switch-sm" title="Тема">🌓</button>
                <div class="date-badge" id="today-date"></div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" data-panel="p-in">Ввод</div>
            <div class="tab" data-panel="p-hist">История</div>
            <div class="tab" data-panel="p-rep">Отчёт</div>
        </div>

        <div class="panel active" id="p-in">
            <div class="view-toggle">
                <button class="view-btn active" data-view="body">Тело</button>
                <button class="view-btn" data-view="organs">Органы</button>
            </div>

            <!-- СИЛУЭТ ТЕЛА -->
            <div class="silhouette-container" id="silhouette-body">
                <svg viewBox="0 0 240 520">
                    <defs>
                        <filter id="bs"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
                    </defs>
                    <g filter="url(#bs)">
                        <ellipse cx="120" cy="40" rx="30" ry="34" class="zone" data-zone="Голова"/>
                        <rect x="106" y="70" width="28" height="22" rx="6" class="zone" data-zone="Шея"/>
                        <path d="M74 90 C74 90, 64 124, 64 160 L64 255 C64 268, 72 279, 91 283 L120 288 L149 283 C168 279, 176 268, 176 255 L176 160 C176 124, 166 90, 166 90 C157 84, 144 78, 120 78 C96 78, 83 84, 74 90 Z" class="zone" data-zone="Торс"/>
                        <path d="M74 98 C63 102, 44 112, 30 130 C21 143, 18 160, 17 178 C16 196, 17 213, 19 229 C20 242, 25 253, 34 260 C42 265, 51 260, 56 251 C58 245, 58 237, 56 228" class="zone" data-zone="Левая рука"/>
                        <ellipse cx="44" cy="264" rx="20" ry="13" class="zone" data-zone="Левая кисть"/>
                        <path d="M166 98 C177 102, 196 112, 210 130 C219 143, 222 160, 223 178 C224 196, 223 213, 221 229 C220 242, 215 253, 206 260 C198 265, 189 260, 184 251 C182 245, 182 237, 184 228" class="zone" data-zone="Правая рука"/>
                        <ellipse cx="196" cy="264" rx="20" ry="13" class="zone" data-zone="Правая кисть"/>
                        <ellipse cx="120" cy="292" rx="56" ry="24" class="zone" data-zone="Таз"/>
                        <path d="M89 305 C80 310, 69 326, 62 353 L58 415 C55 435, 53 453, 56 470 C58 481, 67 488, 80 486 C91 484, 100 474, 102 460" class="zone" data-zone="Левая нога"/>
                        <ellipse cx="80" cy="496" rx="28" ry="12" class="zone" data-zone="Левая стопа"/>
                        <path d="M151 305 C160 310, 171 326, 178 353 L182 415 C185 435, 187 453, 184 470 C182 481, 173 488, 160 486 C149 484, 140 474, 138 460" class="zone" data-zone="Правая нога"/>
                        <ellipse cx="160" cy="496" rx="28" ry="12" class="zone" data-zone="Правая стопа"/>
                    </g>
                </svg>
            </div>

            <!-- СИЛУЭТ ОРГАНОВ (ПОЛНОСТЬЮ ПЕРЕРАБОТАН) -->
            <div class="silhouette-container" id="silhouette-organs" style="display:none;">
                <svg viewBox="0 0 240 520">
                    <defs>
                        <filter id="os"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
                    </defs>
                    <g filter="url(#os)">
                        <!-- Фон тела -->
                        <ellipse cx="120" cy="40" rx="30" ry="34" fill="#f0f4f8" stroke="#c8cdd5" stroke-width="1" opacity="0.2"/>
                        <path d="M74 90 C74 90, 64 124, 64 160 L64 255 C64 268, 72 279, 91 283 L120 288 L149 283 C168 279, 176 268, 176 255 L176 160 C176 124, 166 90, 166 90 C157 84, 144 78, 120 78 C96 78, 83 84, 74 90 Z" fill="#f0f4f8" stroke="#c8cdd5" stroke-width="1" opacity="0.2"/>

                        <!-- МОЗГ -->
                        <ellipse cx="120" cy="30" rx="24" ry="20" class="zone organ-zone" data-zone="Голова" data-organ="Мозг"/>
                        <path d="M106 20 Q120 14 134 20" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.5" pointer-events="none"/>
                        <path d="M104 28 Q120 22 136 28" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.5" pointer-events="none"/>
                        <text x="120" y="35" text-anchor="middle" font-size="9" fill="#1e293b" font-weight="700" pointer-events="none">Мозг</text>

                        <!-- ГЛАЗА -->
                        <ellipse cx="104" cy="20" rx="9" ry="7" class="zone organ-zone" data-zone="Голова" data-organ="Глаза"/>
                        <circle cx="104" cy="20" r="4" fill="#64748b" opacity="0.3" pointer-events="none"/>
                        <ellipse cx="136" cy="20" rx="9" ry="7" class="zone organ-zone" data-zone="Голова" data-organ="Глаза"/>
                        <circle cx="136" cy="20" r="4" fill="#64748b" opacity="0.3" pointer-events="none"/>

                        <!-- УШИ -->
                        <ellipse cx="82" cy="30" rx="8" ry="12" class="zone organ-zone" data-zone="Голова" data-organ="Уши"/>
                        <ellipse cx="158" cy="30" rx="8" ry="12" class="zone organ-zone" data-zone="Голова" data-organ="Уши"/>

                        <!-- ГОРЛО -->
                        <rect x="106" y="68" width="28" height="26" rx="8" class="zone organ-zone" data-zone="Шея" data-organ="Горло"/>
                        <text x="120" y="86" text-anchor="middle" font-size="9" fill="#1e293b" font-weight="700" pointer-events="none">Горло</text>

                        <!-- ЩИТОВИДНАЯ -->
                        <path d="M102 96 C102 90, 114 88, 120 90 C126 88, 138 90, 138 96 C138 102, 126 104, 120 104 C114 104, 102 102, 102 96 Z" class="zone organ-zone" data-zone="Шея" data-organ="Щитовидная железа"/>

                        <!-- ТРАХЕЯ -->
                        <rect x="114" y="94" width="12" height="30" rx="4" class="zone organ-zone" data-zone="Шея" data-organ="Трахея"/>

                        <!-- СЕРДЦЕ (БОЛЬШОЕ) -->
                        <path d="M105 124 C94 114, 80 124, 82 140 C84 154, 105 172, 105 172 C105 172, 126 154, 128 140 C130 124, 116 114, 105 124 Z" class="zone organ-zone" data-zone="Торс" data-organ="Сердце"/>
                        <text x="105" y="147" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="700" pointer-events="none">Сердце</text>

                        <!-- ЛЁГКИЕ (БОЛЬШИЕ, КАК У ЧЕЛОВЕКА) -->
                        <!-- Левое -->
                        <path d="M86 128 C76 118, 66 134, 68 154 C70 172, 86 186, 96 188 L100 186 L96 194 C86 188, 76 174, 72 156 C68 138, 72 120, 86 128 Z" class="zone organ-zone" data-zone="Торс" data-organ="Лёгкие"/>
                        <text x="80" y="158" text-anchor="middle" font-size="9" fill="#1e293b" font-weight="700" pointer-events="none">Лёгкое</text>

                        <!-- Правое -->
                        <path d="M154 128 C164 118, 174 134, 172 154 C170 172, 154 186, 144 188 L140 186 L144 194 C154 188, 164 174, 168 156 C172 138, 168 120, 154 128 Z" class="zone organ-zone" data-zone="Торс" data-organ="Лёгкие"/>
                        <text x="160" y="158" text-anchor="middle" font-size="9" fill="#1e293b" font-weight="700" pointer-events="none">Лёгкое</text>

                        <!-- ПЕЧЕНЬ (БОЛЬШАЯ) -->
                        <path d="M86 190 C76 182, 72 198, 78 212 C84 226, 104 234, 120 234 C136 234, 152 226, 156 216 C160 206, 152 194, 142 190 C134 186, 122 184, 110 186 C102 188, 94 194, 86 190 Z" class="zone organ-zone" data-zone="Торс" data-organ="Печень"/>
                        <text x="118" y="214" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="700" pointer-events="none">Печень</text>

                        <!-- ЖЕЛУДОК (БОЛЬШОЙ) -->
                        <path d="M92 208 C84 200, 80 216, 84 232 C88 246, 100 258, 116 260 C130 262, 144 252, 148 238 C152 226, 144 212, 136 208 C128 204, 118 200, 108 204 C100 208, 96 212, 92 208 Z" class="zone organ-zone" data-zone="Торс" data-organ="Желудок"/>
                        <text x="116" y="235" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="700" pointer-events="none">Желудок</text>

                        <!-- ЖЕЛЧНЫЙ -->
                        <ellipse cx="88" cy="200" rx="8" ry="10" class="zone organ-zone" data-zone="Торс" data-organ="Желчный пузырь"/>

                        <!-- СЕЛЕЗЁНКА -->
                        <ellipse cx="72" cy="190" rx="10" ry="14" class="zone organ-zone" data-zone="Торс" data-organ="Селезёнка"/>

                        <!-- ПОЧКИ (БОЛЬШИЕ) -->
                        <ellipse cx="80" cy="218" rx="14" ry="18" class="zone organ-zone" data-zone="Торс" data-organ="Почки"/>
                        <text x="80" y="224" text-anchor="middle" font-size="8" fill="#1e293b" font-weight="700" pointer-events="none">Почка</text>
                        <ellipse cx="160" cy="218" rx="14" ry="18" class="zone organ-zone" data-zone="Торс" data-organ="Почки"/>
                        <text x="160" y="224" text-anchor="middle" font-size="8" fill="#1e293b" font-weight="700" pointer-events="none">Почка</text>

                        <!-- КИШЕЧНИК (ТОЛСТЫЙ, ВОЛНИСТЫЙ) -->
                        <path d="M78 254 C70 266, 86 274, 92 266 C96 258, 94 274, 102 280 C108 286, 116 272, 124 280 C130 288, 138 274, 146 280 C152 286, 160 274, 168 280 C174 286, 178 274, 170 264 C164 254, 154 248, 144 250 C134 254, 126 246, 116 250 C106 254, 98 246, 90 250 C82 254, 82 248, 78 254 Z" fill="none" stroke="#c8cdd5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" class="zone organ-zone" data-zone="Торс" data-organ="Кишечник"/>
                        <text x="126" y="270" text-anchor="middle" font-size="8" fill="#1e293b" font-weight="700" pointer-events="none">Кишечник</text>

                        <!-- ПОДЖЕЛУДОЧНАЯ -->
                        <path d="M94 250 C90 244, 106 238, 120 240 C134 242, 150 246, 154 254 C150 260, 138 262, 124 260 C110 258, 98 256, 94 250 Z" class="zone organ-zone" data-zone="Торс" data-organ="Поджелудочная"/>

                        <!-- АППЕНДИКС -->
                        <circle cx="70" cy="264" r="8" class="zone organ-zone" data-zone="Торс" data-organ="Аппендикс"/>

                        <!-- МОЧЕВОЙ ПУЗЫРЬ -->
                        <ellipse cx="120" cy="290" rx="22" ry="16" class="zone organ-zone" data-zone="Таз" data-organ="Мочевой пузырь"/>
                        <text x="120" y="295" text-anchor="middle" font-size="8" fill="#1e293b" font-weight="700" pointer-events="none">Мочевой пузырь</text>

                        <!-- РЕПРОДУКТИВНЫЕ -->
                        <ellipse cx="120" cy="314" rx="20" ry="10" class="zone organ-zone" data-zone="Таз" data-organ="Репродуктивные органы"/>

                        <!-- ТАЗОБЕДРЕННЫЕ -->
                        <circle cx="94" cy="294" rx="11" ry="11" class="zone organ-zone" data-zone="Таз" data-organ="Тазобедренный сустав"/>
                        <circle cx="146" cy="294" rx="11" ry="11" class="zone organ-zone" data-zone="Таз" data-organ="Тазобедренный сустав"/>

                        <!-- ПЛЕЧИ -->
                        <circle cx="48" cy="130" rx="10" ry="10" class="zone organ-zone" data-zone="Левая рука" data-organ="Плечо"/>
                        <text x="48" y="134" text-anchor="middle" font-size="7" fill="#1e293b" font-weight="600" pointer-events="none">Плечо</text>
                        <circle cx="192" cy="130" rx="10" ry="10" class="zone organ-zone" data-zone="Правая рука" data-organ="Плечо"/>
                        <text x="192" y="134" text-anchor="middle" font-size="7" fill="#1e293b" font-weight="600" pointer-events="none">Плечо</text>

                        <!-- ЛОКТИ -->
                        <circle cx="38" cy="210" rx="9" ry="9" class="zone organ-zone" data-zone="Левая рука" data-organ="Локоть"/>
                        <circle cx="202" cy="210" rx="9" ry="9" class="zone organ-zone" data-zone="Правая рука" data-organ="Локоть"/>

                        <!-- КОЛЕНИ -->
                        <circle cx="74" cy="370" rx="12" ry="12" class="zone organ-zone" data-zone="Левая нога" data-organ="Колено"/>
                        <text x="74" y="376" text-anchor="middle" font-size="7" fill="#1e293b" font-weight="600" pointer-events="none">Колено</text>
                        <circle cx="166" cy="370" rx="12" ry="12" class="zone organ-zone" data-zone="Правая нога" data-organ="Колено"/>
                        <text x="166" y="376" text-anchor="middle" font-size="7" fill="#1e293b" font-weight="600" pointer-events="none">Колено</text>

                        <!-- ИКРЫ -->
                        <ellipse cx="74" cy="410" rx="12" ry="20" class="zone organ-zone" data-zone="Левая нога" data-organ="Икроножная мышца"/>
                        <text x="74" y="418" text-anchor="middle" font-size="7" fill="#1e293b" font-weight="600" pointer-events="none">Икра</text>
                        <ellipse cx="166" cy="410" rx="12" ry="20" class="zone organ-zone" data-zone="Правая нога" data-organ="Икроножная мышца"/>
                        <text x="166" y="418" text-anchor="middle" font-size="7" fill="#1e293b" font-weight="600" pointer-events="none">Икра</text>
                    </g>
                </svg>
            </div>

            <div class="section-title" id="selected-info" style="text-align:center;min-height:22px;font-size:14px;"></div>

            <div class="section-title">Тип</div>
            <div class="btn-row" id="type-buttons">
                <div class="btn" data-type="Боль">Боль</div>
                <div class="btn" data-type="Тошнота">Тошнота</div>
                <div class="btn" data-type="Головокружение">Круж.гол</div>
                <div class="btn" data-type="Онемение">Онемение</div>
                <div class="btn" data-type="Жжение">Жжение</div>
                <div class="btn" data-type="Давление">Давление</div>
                <div class="btn" data-type="Спазм">Спазм</div>
                <div class="btn" data-type="Другое">Другое</div>
            </div>

            <div id="pain-char-row" style="display:none;">
                <div class="section-title">Характер</div>
                <div class="btn-row" id="pain-char-buttons">
                    <div class="btn" data-pain-char="Острая">Острая</div>
                    <div class="btn" data-pain-char="Тянущая">Тянущая</div>
                    <div class="btn" data-pain-char="Пульсирующая">Пульсир</div>
                    <div class="btn" data-pain-char="Тупая">Тупая</div>
                </div>
            </div>

            <div class="section-title">Интенсивность</div>
            <div class="intensity-row" id="intensity-buttons"></div>

            <textarea class="note-input" placeholder="Заметка" id="note"></textarea>
            <button class="save-btn" id="save-btn">Зафиксировать</button>
            <div class="saved-msg" id="saved-msg">✅ Записано</div>
        </div>

        <div class="panel" id="p-hist"><div id="history-list"></div></div>

        <div class="panel" id="p-rep">
            <div class="card">
                <div class="section-title" style="margin-top:0">Период</div>
                <div class="report-row">
                    <input type="date" id="r-from"><span>—</span><input type="date" id="r-to">
                    <button class="report-btn" id="gen-rep">Показать</button>
                </div>
                <div class="report-output" id="rep-out">Выбери период и нажми «Показать».</div>
                <div class="report-actions">
                    <button class="copy-btn" id="copy-rep">📋 Скопировать</button>
                    <button class="copy-btn" id="pdf-rep">🖨️ Сохранить PDF</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modal-overlay">
            <div class="modal">
                <h3>📝 Детали</h3>
                <div id="modal-content"></div>
                <div class="btn-row">
                    <button class="btn-close-modal" id="btn-close">Закрыть</button>
                    <button class="btn-save-context" id="btn-save">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
