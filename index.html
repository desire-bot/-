<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f0f4f8"> 
    <title>МедКарта</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ПРИВЕТСТВЕННЫЙ ЭКРАН -->
    <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-content">
            <div class="welcome-icon">🏥</div>
            <h1 class="welcome-title">Симптомы</h1>
            <p class="welcome-subtitle">Ваш персональный дневник здоровья</p>
            
            <div class="welcome-card">
                <div class="welcome-greeting" id="welcome-greeting"></div>
                <p class="welcome-date" id="welcome-date"></p>
                
                <div class="welcome-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-records">0</div>
                        <div class="stat-label">записей</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-days">0</div>
                        <div class="stat-label">дней</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-streak">0</div>
                        <div class="stat-label">дней подряд</div>
                    </div>
                </div>
            </div>

            <div class="welcome-motivation" id="welcome-motivation"></div>

            <div class="welcome-actions">
                <button class="welcome-btn primary" id="btn-start-record">✚ Записать симптом</button>
                <button class="welcome-btn secondary" id="btn-go-history">📋 История</button>
            </div>

            <div class="welcome-footer">
                <button class="lang-switch" id="lang-switch">🌐 English</button>
                <button class="theme-switch" id="theme-switch">🌙 Тёмная тема</button>
                <span class="version">v2.1</span>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div class="app-screen" id="app-screen" style="display:none;">
        <div class="header">
            <button class="back-btn" id="back-btn">←</button>
            <h1>🩺 Симптомы</h1>
            <div class="header-actions">
                <button class="theme-switch-sm" id="theme-switch-sm" title="Тема">🌓</button>
                <div class="date-badge" id="today-date"></div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" data-panel="p-in">Ввод</div>
            <div class="tab" data-panel="p-hist">История</div>
            <div class="tab" data-panel="p-rep">Отчёт</div>
        </div>

        <!-- Ввод -->
        <div class="panel active" id="p-in">
            <div class="view-toggle">
                <button class="view-btn active" data-view="body">Тело</button>
                <button class="view-btn" data-view="organs">Органы</button>
            </div>

            <div class="silhouette-container" id="silhouette-body">
                <svg viewBox="0 0 200 420">
                    <defs>
                        <filter id="body-shadow">
                            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
                        </filter>
                    </defs>
                    
                    <g filter="url(#body-shadow)">
                        <!-- Голова -->
                        <ellipse cx="100" cy="32" rx="24" ry="27" class="zone" data-zone="Голова"/>
                        
                        <!-- Шея -->
                        <rect x="90" y="56" width="20" height="16" rx="4" class="zone" data-zone="Шея"/>
                        
                        <!-- Торс -->
                        <path d="M63 72 
                                 C63 72, 58 100, 58 130 
                                 L58 210 
                                 C58 220, 65 228, 80 232 
                                 L100 236 
                                 L120 232 
                                 C135 228, 142 220, 142 210 
                                 L142 130 
                                 C142 100, 137 72, 137 72 
                                 C130 68, 120 66, 100 66 
                                 C80 66, 70 68, 63 72 Z" 
                              class="zone" data-zone="Торс"/>
                        
                        <!-- Левая рука -->
                        <path d="M63 80 
                                 C55 82, 38 90, 25 105 
                                 C18 115, 15 128, 14 142 
                                 C13 156, 14 170, 16 182 
                                 C17 192, 20 200, 28 205 
                                 C34 208, 42 205, 46 198 
                                 C48 194, 48 188, 46 182" 
                              class="zone" data-zone="Левая рука"/>
                        <ellipse cx="38" cy="208" rx="14" ry="10" class="zone" data-zone="Левая кисть"/>
                        
                        <!-- Правая рука -->
                        <path d="M137 80 
                                 C145 82, 162 90, 175 105 
                                 C182 115, 185 128, 186 142 
                                 C187 156, 186 170, 184 182 
                                 C183 192, 180 200, 172 205 
                                 C166 208, 158 205, 154 198 
                                 C152 194, 152 188, 154 182" 
                              class="zone" data-zone="Правая рука"/>
                        <ellipse cx="162" cy="208" rx="14" ry="10" class="zone" data-zone="Правая кисть"/>
                        
                        <!-- Таз -->
                        <ellipse cx="100" cy="236" rx="45" ry="18" class="zone" data-zone="Таз"/>
                        
                        <!-- Левая нога -->
                        <path d="M76 245 
                                 C70 248, 60 260, 55 280 
                                 L52 330 
                                 C50 345, 48 358, 50 370 
                                 C52 378, 58 382, 68 380 
                                 C76 378, 82 372, 84 362" 
                              class="zone" data-zone="Левая нога"/>
                        <ellipse cx="68" cy="390" rx="22" ry="9" class="zone" data-zone="Левая стопа"/>
                        
                        <!-- Правая нога -->
                        <path d="M124 245 
                                 C130 248, 140 260, 145 280 
                                 L148 330 
                                 C150 345, 152 358, 150 370 
                                 C148 378, 142 382, 132 380 
                                 C124 378, 118 372, 116 362" 
                              class="zone" data-zone="Правая нога"/>
                        <ellipse cx="132" cy="390" rx="22" ry="9" class="zone" data-zone="Правая стопа"/>
                    </g>
                </svg>
            </div>

            <div class="silhouette-container" id="silhouette-organs" style="display:none;">
                <svg viewBox="0 0 200 420">
                    <defs>
                        <filter id="organ-shadow">
                            <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
                        </filter>
                    </defs>
                    
                    <g filter="url(#organ-shadow)">
                        <!-- Контур тела (фон) -->
                        <ellipse cx="100" cy="32" rx="24" ry="27" fill="#f0f4f8" stroke="#c8cdd5" stroke-width="1" opacity="0.3"/>
                        <path d="M63 72 C63 72, 58 100, 58 130 L58 210 C58 220, 65 228, 80 232 L100 236 L120 232 C135 228, 142 220, 142 210 L142 130 C142 100, 137 72, 137 72 C130 68, 120 66, 100 66 C80 66, 70 68, 63 72 Z" fill="#f0f4f8" stroke="#c8cdd5" stroke-width="1" opacity="0.3"/>
                        
                        <!-- Мозг -->
                        <ellipse cx="100" cy="28" rx="16" ry="14" class="zone organ-zone" data-zone="Голова" data-organ="Мозг"/>
                        <text x="100" y="32" text-anchor="middle" font-size="6" fill="#64748b" pointer-events="none">Мозг</text>
                        
                        <!-- Глаза -->
                        <ellipse cx="90" cy="24" rx="5" ry="4" class="zone organ-zone" data-zone="Голова" data-organ="Глаза"/>
                        <ellipse cx="110" cy="24" rx="5" ry="4" class="zone organ-zone" data-zone="Голова" data-organ="Глаза"/>
                        
                        <!-- Уши -->
                        <ellipse cx="72" cy="28" rx="4" ry="6" class="zone organ-zone" data-zone="Голова" data-organ="Уши"/>
                        <ellipse cx="128" cy="28" rx="4" ry="6" class="zone organ-zone" data-zone="Голова" data-organ="Уши"/>
                        
                        <!-- Нос -->
                        <ellipse cx="100" cy="34" rx="4" ry="3" class="zone organ-zone" data-zone="Голова" data-organ="Нос"/>
                        
                        <!-- Рот/Зубы -->
                        <ellipse cx="100" cy="42" rx="6" ry="3" class="zone organ-zone" data-zone="Голова" data-organ="Зубы"/>
                        
                        <!-- Горло -->
                        <rect x="92" y="55" width="16" height="12" rx="3" class="zone organ-zone" data-zone="Шея" data-organ="Горло"/>
                        <text x="100" y="63" text-anchor="middle" font-size="5" fill="#64748b" pointer-events="none">Горло</text>
                        
                        <!-- Щитовидная -->
                        <rect x="88" y="68" width="24" height="6" rx="2" class="zone organ-zone" data-zone="Шея" data-organ="Щитовидная железа"/>
                        
                        <!-- Сердце -->
                        <ellipse cx="85" cy="100" rx="12" ry="14" class="zone organ-zone" data-zone="Торс" data-organ="Сердце"/>
                        <text x="85" y="104" text-anchor="middle" font-size="6" fill="#64748b" pointer-events="none">Сердце</text>
                        
                        <!-- Лёгкие -->
                        <ellipse cx="78" cy="108" rx="14" ry="18" class="zone organ-zone" data-zone="Торс" data-organ="Лёгкие"/>
                        <ellipse cx="122" cy="108" rx="14" ry="18" class="zone organ-zone" data-zone="Торс" data-organ="Лёгкие"/>
                        <text x="78" y="112" text-anchor="middle" font-size="6" fill="#64748b" pointer-events="none">Лёгкое</text>
                        <text x="122" y="112" text-anchor="middle" font-size="6" fill="#64748b" pointer-events="none">Лёгкое</text>
                        
                        <!-- Печень -->
                        <path d="M75 130 C75 125, 95 120, 100 125 C105 120, 125 125, 125 130 C125 140, 95 145, 75 130 Z" class="zone organ-zone" data-zone="Торс" data-organ="Печень"/>
                        <text x="100" y="135" text-anchor="middle" font-size="6" fill="#64748b" pointer-events="none">Печень</text>
                        
                        <!-- Желудок -->
                        <ellipse cx="95" cy="145" rx="14" ry="11" class="zone organ-zone" data-zone="Торс" data-organ="Желудок"/>
                        <text x="95" y="148" text-anchor="middle" font-size="6" fill="#64748b" pointer-events="none">Желудок</text>
                        
                        <!-- Поджелудочная -->
                        <ellipse cx="105" cy="158" rx="16" ry="5" class="zone organ-zone" data-zone="Торс" data-organ="Поджелудочная"/>
                        <text x="105" y="160" text-anchor="middle" font-size="5" fill="#64748b" pointer-events="none">Поджелуд.</text>
                        
                        <!-- Кишечник -->
                        <path d="M80 155 C80 170, 120 170, 120 185 C120 195, 80 195, 80 210 C80 220, 120 220, 120 225" fill="none" stroke="#c8cdd5" stroke-width="6" stroke-linecap="round" class="zone organ-zone" data-zone="Торс" data-organ="Кишечник"/>
                        
                        <!-- Почки -->
                        <ellipse cx="72" cy="160" rx="6" ry="9" class="zone organ-zone" data-zone="Торс" data-organ="Почки"/>
                        <ellipse cx="128" cy="160" rx="6" ry="9" class="zone organ-zone" data-zone="Торс" data-organ="Почки"/>
                        <text x="72" y="163" text-anchor="middle" font-size="5" fill="#64748b" pointer-events="none">Почка</text>
                        <text x="128" y="163" text-anchor="middle" font-size="5" fill="#64748b" pointer-events="none">Почка</text>
                        
                        <!-- Мочевой пузырь -->
                        <ellipse cx="100" cy="220" rx="12" ry="8" class="zone organ-zone" data-zone="Таз" data-organ="Мочевой пузырь"/>
                        <text x="100" y="223" text-anchor="middle" font-size="5" fill="#64748b" pointer-events="none">Моч.пуз.</text>
                    </g>
                </svg>
            </div>

            <div class="section-title" id="selected-info" style="text-align:center;min-height:18px;"></div>

            <div class="section-title">Тип</div>
            <div class="btn-row" id="type-buttons">
                <div class="btn" data-type="Боль">Боль</div>
                <div class="btn" data-type="Тошнота">Тошнота</div>
                <div class="btn" data-type="Головокружение">Круж.гол</div>
                <div class="btn" data-type="Онемение">Онемение</div>
                <div class="btn" data-type="Жжение">Жжение</div>
                <div class="btn" data-type="Давление">Давление</div>
                <div class="btn" data-type="Спазм">Спазм</div>
                <div class="btn" data-type="Другое">Другое</div>
            </div>

            <div id="pain-char-row" style="display:none;">
                <div class="section-title">Характер</div>
                <div class="btn-row" id="pain-char-buttons">
                    <div class="btn" data-pain-char="Острая">Острая</div>
                    <div class="btn" data-pain-char="Тянущая">Тянущая</div>
                    <div class="btn" data-pain-char="Пульсирующая">Пульсир</div>
                    <div class="btn" data-pain-char="Тупая">Тупая</div>
                </div>
            </div>

            <div class="section-title">Интенсивность</div>
            <div class="intensity-row" id="intensity-buttons"></div>

            <textarea class="note-input" placeholder="Заметка" id="note"></textarea>
            <button class="save-btn" id="save-btn">Зафиксировать</button>
            <div class="saved-msg" id="saved-msg">✅ Записано</div>
        </div>

        <!-- История -->
        <div class="panel" id="p-hist">
            <div id="history-list"></div>
        </div>

        <!-- Отчёт -->
        <div class="panel" id="p-rep">
            <div class="card">
                <div class="section-title" style="margin-top:0">Период</div>
                <div class="report-row">
                    <input type="date" id="r-from">
                    <span>—</span>
                    <input type="date" id="r-to">
                    <button class="report-btn" id="gen-rep">Показать</button>
                </div>
                
                <div class="report-output" id="rep-out">Выбери период и нажми «Показать».</div>
                <div class="report-actions">
                    <button class="copy-btn" id="copy-rep">📋 Скопировать</button>
                    <button class="copy-btn" id="pdf-rep">🖨️ Сохранить PDF</button>
                </div>
            </div>
        </div>

        <!-- Модалка -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal">
                <h3>📝 Детали</h3>
                <div id="modal-content"></div>
                <div class="btn-row">
                    <button class="btn-close-modal" id="btn-close">Закрыть</button>
                    <button class="btn-save-context" id="btn-save">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
